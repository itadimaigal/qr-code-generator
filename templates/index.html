<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6fb; color: #1d2433; margin: 0; }
    main { max-width: 560px; margin: 48px auto; background: #fff; padding: 32px; border-radius: 16px;
           box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 26px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type=text] { flex: 1; min-width: 220px; padding: 12px; font-size: 16px; border: 1px solid #ccd; border-radius: 8px; }
    select, button { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccd; }
    button { background: #2f6fed; color: #fff; border: none; cursor: pointer; }
    .qr { text-align: center; margin-top: 24px; }
    .qr svg { width: 280px; height: 280px; }
    .meta { color: #667; font-size: 14px; }
    .error { color: #c0392b; margin-top: 16px; }
    a.download { display: inline-block; margin-top: 12px; color: #2f6fed; }
  </style>
</head>
<body>
<main>
  <h1>QR Code Generator</h1>
  <form method="get">
    <input type="text" name="link" placeholder="https://example.com" value="{{ link }}" autofocus>
    <select name="ec">
      {% for level in "LMQH" %}<option value="{{ level }}" {% if level == ec %}selected{% endif %}>EC {{ level }}</option>{% endfor %}
    </select>
    <button type="submit">Make QR</button>
  </form>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if svg %}
  <div class="qr">
    {{ svg | safe }}
    <p class="meta">version {{ qr.version }} · {{ qr.size }}×{{ qr.size }} modules · mask {{ qr.mask }}</p>
    <a class="download" href="/qr.png?link={{ link | urlencode }}&ec={{ ec }}">Download PNG</a>
  </div>
  {% endif %}
</main>
</body>
</html>
